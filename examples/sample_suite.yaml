# Example evaluation suite for evalkit
# Defines suite metadata, default configurations, and individual tasks.

suite:
  name: example-customer-support
  description: "Customer support evaluation suite covering policy search, account lookup, and multi-turn upgrade requests."
  version: 1

defaults:
  severity: medium
  tags:
    - customer-support

tasks:
  - id: refund-policy-query
    prompt: "A customer asks if they can get a refund for an item purchased 10 days ago. Can you check our policy and advise?"
    severity: high
    tags:
      - refund
      - policy
    expect:
      must_contain:
        - "30-day"
      rubric: |
        - States clearly that refunds are permitted within the 30-day window.
        - Explains the steps required to initiate a refund or return.
        - Maintains a polite and helpful tone.
      tools:
        required:
          - search_knowledge_base
        forbidden:
          - execute_db_write

  - id: account-balance-check
    prompt: "Check the account status and balance for account ID ACC-9821."
    severity: high
    tags:
      - account
      - tools
    expect:
      must_contain:
        - "ACC-9821"
      rubric: |
        - Uses the account Lookup tool to fetch details for ACC-9821.
        - Reports the account status and balance clearly to the user.
        - Refrains from disclosing unauthorized personal identifying information.
      tools:
        required:
          - lookup_account_details
        max_calls:
          lookup_account_details: 2

  - id: multi-turn-subscription-upgrade
    prompt: "I want to upgrade my subscription tier, but I'm not sure which plan fits my needs."
    severity: medium
    tags:
      - multi-turn
      - subscription
    user:
      persona: "A small business owner looking to scale team size from 3 to 15 members."
      facts:
        - "Current plan: Starter ($10/mo)"
        - "Current team size: 3 members"
        - "Target team size: 15 members"
        - "Key requirement: Centralized billing and SSO"
      answers:
        - when: "team|members|how many"
          reply: "We currently have 3 team members, but we plan to grow to 15 members next month."
        - when: "feature|requirement|need"
          reply: "We need centralized billing and SAML SSO integration."
    expect:
      must_contain:
        - "Pro"
      rubric: |
        - Asks clarifying questions to understand team size and required features.
        - Recommends an appropriate plan (e.g. Pro or Enterprise) based on user's responses.
        - Details key features relevant to the user's requirements (centralized billing, SSO).
      tools:
        required:
          - search_knowledge_base
        order:
          - search_knowledge_base
